{% extends 'Webapp/base.html' %}

{% block content %}
<div class="container text-center my-5">
    <div class="card shadow p-5 border-0 bg-light mx-auto" style="max-width: 500px;">
        <div class="text-warning mb-3">
            <i class="fas fa-exclamation-triangle fa-4x"></i>
        </div>
        <h2 class="fw-bold text-dark mb-3">Check-In No Disponible</h2>
        <p class="text-muted">
            Esta cita no está disponible para auto-registro en este momento. Puede deberse a que ya pasó su hora, fue cancelada o el horario no coincide.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg mt-3 w-100 shadow-sm">
            <i class="fas fa-home me-2"></i>Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
